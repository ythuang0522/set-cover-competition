<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" role="img" aria-labelledby="t d">
  <title id="t">How the competition works: your solver.cpp and the six instances go into grade.py; a score table and result.json come out</title>
  <desc id="d">You write solver.cpp. grade.py runs it for 60 seconds on each of six instances, checks the cover is valid, divides its cost by the instance's proven lower bound, and prints the geometric mean, which is your score (lower is better). It also writes result.json, which you upload with solver.cpp.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#14324D"/>
    </marker>
  </defs>
  <style>
    .s  { font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif; }
    .m  { font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace; }
    .h  { font-size:17px; font-weight:700; fill:#14324D; }
    .b  { font-size:14px; fill:#1B1B1B; }
    .sm { font-size:12.5px; fill:#6B6B6B; }
    .lbl{ font-size:12px; font-weight:700; fill:#0E7490; letter-spacing:0.5px; }
    .tt { font-size:13px; fill:#1B1B1B; }
    .th { font-size:12px; font-weight:700; fill:#6B6B6B; }
    .acc{ fill:#C2410C; font-weight:700; }
    .good{ fill:#15803D; font-weight:700; }
    .bad{ fill:#B3261E; font-weight:700; }
  </style>
  <rect width="1400" height="640" fill="#ffffff"/>

  <!-- left: inputs -->
  <text x="40" y="52" class="s lbl">YOU WRITE</text>
  <rect x="40" y="66" width="300" height="118" rx="12" fill="#FFF4EC" stroke="#C2410C" stroke-width="2"/>
  <text x="60" y="98" class="m h" style="fill:#C2410C">solver.cpp</text>
  <text x="60" y="124" class="s b">one C++17 file, one thread</text>
  <text x="60" y="146" class="s b">starts as setcover_foundation.cpp</text>
  <text x="60" y="168" class="s sm">./solver &lt;instance.scp&gt; &lt;out.cover&gt; 60</text>

  <text x="40" y="240" class="s lbl">WE PROVIDE</text>
  <rect x="40" y="254" width="300" height="230" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="60" y="284" class="s h">6 instances</text>
  <text x="60" y="310" class="m tt">rnd10k    10,000 x 100,000</text>
  <text x="60" y="332" class="m tt">sparse5k   5,000 x  60,000</text>
  <text x="60" y="354" class="m tt">uni5k      5,000 x  60,000  (unicost)</text>
  <text x="60" y="376" class="m tt">geo10k    10,000 x  50,000  (disks)</text>
  <text x="60" y="398" class="m tt">blocks8k   8,000 x  50,000  (blocks)</text>
  <text x="60" y="420" class="m tt">tail8k     8,000 x  60,000  (heavy tail)</text>
  <text x="60" y="452" class="s sm">elements x sets, each with a PROVEN</text>
  <text x="60" y="470" class="s sm">lower bound on its optimal cover cost</text>

  <!-- arrows into grade.py -->
  <path d="M340 125 C 400 125, 400 300, 460 300" fill="none" stroke="#14324D" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M340 369 C 400 369, 400 330, 460 330" fill="none" stroke="#14324D" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- middle: grade.py -->
  <rect x="470" y="200" width="300" height="240" rx="14" fill="#E0F2FE" stroke="#0E7490" stroke-width="2.5"/>
  <text x="620" y="240" text-anchor="middle" class="m h" style="fill:#0E7490;font-size:20px">grade.py</text>
  <text x="490" y="276" class="s b">for each instance:</text>
  <text x="500" y="300" class="s b">1. run your solver for <tspan class="acc">60 s</tspan></text>
  <text x="500" y="324" class="s b">2. check every element is covered</text>
  <text x="500" y="348" class="s b">3. cover cost ÷ lower bound</text>
  <text x="490" y="384" class="s b">then: geometric mean of the six</text>
  <text x="490" y="412" class="s sm">also enforces 4 GB, one thread, N lines</text>

  <!-- arrow out -->
  <path d="M770 320 L 830 320" fill="none" stroke="#14324D" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- right: output table -->
  <text x="840" y="52" class="s lbl">YOU GET</text>
  <rect x="840" y="66" width="520" height="418" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="860" y="96" class="m th">instance     cost    bound    ratio   excess   note</text>
  <line x1="860" y1="106" x2="1340" y2="106" stroke="#CBD5E1"/>
  <text x="860" y="130" class="m tt">rnd10k      2454     2204   <tspan class="good">1.1134</tspan>  +11.34%   ok</text>
  <text x="860" y="154" class="m tt">sparse5k    2649     2542   <tspan class="good">1.0421</tspan>   +4.21%   ok</text>
  <text x="860" y="178" class="m tt">uni5k        850      625   <tspan class="good">1.3600</tspan>  +36.00%   ok</text>
  <text x="860" y="202" class="m tt">geo10k      4146     3312   <tspan class="good">1.2518</tspan>  +25.18%   ok</text>
  <text x="860" y="226" class="m tt">blocks8k       -     3034   <tspan class="bad">2.0000</tspan>       -    TIMEOUT</text>
  <text x="860" y="250" class="m tt">tail8k      5440     4253   <tspan class="good">1.2791</tspan>  +27.91%   ok</text>
  <line x1="860" y1="266" x2="1340" y2="266" stroke="#CBD5E1"/>
  <text x="860" y="294" class="m tt">Overall geomean ratio = <tspan class="acc" style="font-size:16px">1.3100</tspan>   &lt;- your score</text>
  <text x="860" y="318" class="s sm">lower is better · 1.0000 would be provably optimal everywhere</text>
  <text x="860" y="336" class="s sm">a failed instance counts as 2.0 (here: TIMEOUT on blocks8k)</text>

  <rect x="860" y="360" width="480" height="104" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="880" y="390" class="m h" style="fill:#14324D">result.json</text>
  <text x="880" y="414" class="s b">the same table, machine-readable</text>
  <text x="880" y="436" class="s b">upload it <tspan style="font-weight:700">with solver.cpp</tspan> to the scoreboard</text>
  <text x="880" y="456" class="s sm">setcover.ccu2026algorithm.workers.dev</text>

  <!-- bottom note -->
  <text x="40" y="560" class="s h" style="fill:#14324D">The only thing you control is solver.cpp. The only number that matters is cost ÷ bound.</text>
  <text x="40" y="588" class="s b">The greedy foundation scores about 1.3 (its covers cost 30% more than the bound). Dropping redundant sets is worth a few percent,</text>
  <text x="40" y="610" class="s b">a Lagrangian heuristic ~10%, a local search that swaps sets for the rest of the minute another 5-10%. The bound is a few % below optimal.</text>
</svg>
